[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-complaints-nlp"
version = "1.0.0"
description = "Leakage-free multi-class NLP classification of CFPB financial consumer complaints using TF-IDF scikit-learn Pipelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["complaints_nlp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
